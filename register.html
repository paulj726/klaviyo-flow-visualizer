<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Klaviyo Flow Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 48px;
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 28px;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .logo p {
      color: #718096;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #2d3748;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group small {
      display: block;
      margin-top: 6px;
      color: #718096;
      font-size: 13px;
    }

    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 24px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #c6f6d5;
      color: #2f855a;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 24px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #5568d3;
    }

    .submit-btn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      color: #718096;
      font-size: 14px;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .password-requirements {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      font-size: 13px;
    }

    .password-requirements p {
      color: #4a5568;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .password-requirements ul {
      margin-left: 20px;
      color: #718096;
    }

    .password-requirements li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo">
      <h1>Klaviyo Flow Visualizer</h1>
      <p>Create your account</p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="new-password"
          placeholder="Create a password"
          minlength="8"
        >
        <div class="password-requirements">
          <p>Password must contain:</p>
          <ul>
            <li>At least 8 characters</li>
            <li>At least one uppercase letter</li>
            <li>At least one lowercase letter</li>
            <li>At least one number</li>
          </ul>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          required
          autocomplete="new-password"
          placeholder="Confirm your password"
          minlength="8"
        >
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Create Account
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';

    // Initialize Supabase client (we'll need to pass these from the server)
    const supabaseUrl = window.SUPABASE_URL;
    const supabaseAnonKey = window.SUPABASE_ANON_KEY;

    if (!supabaseUrl || !supabaseAnonKey) {
      console.error('Supabase configuration missing');
      showError('Configuration error. Please contact support.');
    }

    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      successDiv.classList.remove('show');
    }

    function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.classList.add('show');
      errorDiv.classList.remove('show');
    }

    function hideMessages() {
      errorDiv.classList.remove('show');
      successDiv.classList.remove('show');
    }

    function setLoading(loading) {
      if (loading) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span>Creating account...';
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
      }
    }

    function validatePassword(password) {
      const minLength = password.length >= 8;
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasNumber = /\d/.test(password);

      return minLength && hasUpper && hasLower && hasNumber;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Client-side validation
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      if (!validatePassword(password)) {
        showError('Password does not meet requirements.');
        return;
      }

      setLoading(true);

      try {
        // Sign up with Supabase
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: `${window.location.origin}/`
          }
        });

        if (error) {
          throw error;
        }

        // Check if email confirmation is required
        if (data.user && !data.session) {
          showSuccess('Account created! Please check your email to confirm your account before signing in.');
          form.reset();
        } else if (data.session) {
          // Auto-login if email confirmation is disabled
          showSuccess('Account created successfully! Redirecting...');
          setTimeout(() => {
            window.location.href = '/settings.html';
          }, 1500);
        }

        setLoading(false);
      } catch (error) {
        console.error('Registration error:', error);

        let errorMessage = 'Failed to create account. Please try again.';
        if (error.message === 'User already registered') {
          errorMessage = 'An account with this email already exists.';
        } else if (error.message) {
          errorMessage = error.message;
        }

        showError(errorMessage);
        setLoading(false);
      }
    });

    // Check if user is already logged in
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/';
      }
    })();
  </script>
</body>
</html>
